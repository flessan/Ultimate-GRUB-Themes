name: Catalog issue
description: Report a broken theme link, incorrect preview, or inaccurate catalog information.
title: "[Catalog issue] "
body:
  - type: markdown
    attributes:
      value: |
        Use this form for problems with an existing catalog entry. To suggest a new theme, use the theme submission form.
  - type: input
    id: theme
    attributes:
      label: Theme name
      description: Which catalog entry is affected?
      placeholder: Theme name
    validations:
      required: true
  - type: dropdown
    id: problem
    attributes:
      label: Problem type
      options:
        - Broken source link
        - Missing or incorrect preview
        - Incorrect author attribution
        - Incorrect or missing license information
        - Duplicate entry
        - Other
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Explain what is incorrect and provide a corrected source when possible.
      placeholder: Describe the problem...
    validations:
      required: true
  - type: input
    id: reference
    attributes:
      label: Reference URL
      description: Link to the correct source, license, or preview, if available.
      placeholder: https://
    validations:
      required: false
